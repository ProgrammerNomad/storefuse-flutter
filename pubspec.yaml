name: storefuse_app
description: StoreFuse Flutter mobile client for WooCommerce via StoreFuse Bridge.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  path_provider: ^2.1.5
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  webview_flutter: ^4.13.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  cached_network_image: ^3.4.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

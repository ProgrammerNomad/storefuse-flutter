name: storefuse_app
description: StoreFuse Flutter mobile client for WooCommerce via StoreFuse Bridge.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  path_provider: ^2.1.5
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  webview_flutter: ^4.13.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  flutter_widget_from_html: ^0.17.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/storefuse-mark.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/storefuse-app-icon.png
  adaptive_icon_background: '#0F172A'
  adaptive_icon_foreground: assets/branding/storefuse-adaptive-foreground.png
  remove_alpha_ios: true
  background_color_ios: '#0F172A'
